services:
  front:
    container_name: ghc_front_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://ghc-api.ghmate.com
        VITE_SOCKET_URL: https://ghc-api.ghmate.com
        VITE_LIVEKIT_URL: wss://ghc-api.ghmate.com/livekit
        VITE_ENV: production
    networks:
      - ghc_prod
      - nginx_proxy
    mem_limit: 256m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    container_name: ghc_api_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1g
    restart: always
    healthcheck:
      # node:20-bullseye-slim 이미지엔 wget/curl 이 없어 기존 wget 헬스체크는 항상 실패했다.
      # 이미지에 반드시 있는 node 런타임으로 /health 를 확인한다.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    container_name: ghc_livekit_prod
    image: livekit/livekit-server:latest
    # Host network: binds 7880/tcp (signaling) + 40100/udp (WebRTC media) directly.
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    # use_external_ip (livekit.yaml) STUN-detects + advertises the public IP, so external
    # (cellular) clients reach media via the forwarded 40100/udp. No --node-ip (it's
    # ignored when use_external_ip is true).
    command: ["--config", "/etc/livekit.yaml"]
    mem_limit: 4g
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  turn:
    container_name: ghc_turn_prod
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf"]
    mem_limit: 512m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis coordinates livekit-server <-> ingress. Bound to loopback only (host network
  # would otherwise expose 6379 publicly).
  redis:
    container_name: ghc_redis_prod
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--protected-mode", "yes"]
    mem_limit: 256m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # LiveKit Ingress: OBS → RTMP(1935) → publishes into the room as a participant. Config is
  # injected via INGRESS_CONFIG_BODY so the API secret never lives in a committed file
  # (interpolated from ghc_service/.env, same as MYSQL_* below). 1935/tcp must be
  # forwarded on the router; point a DNS-only (grey-cloud) record at it (INGRESS_RTMP_HOST).
  ingress:
    container_name: ghc_ingress_prod
    image: livekit/ingress:latest
    network_mode: host
    environment:
      INGRESS_CONFIG_BODY: |
        logging:
          level: info
        redis:
          address: 127.0.0.1:6379
        ws_url: ws://127.0.0.1:7880
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        rtmp_port: 1935
        http_relay_port: 9090
        health_port: 9091
    depends_on:
      - redis
      - livekit
    mem_limit: 2g
    # cpus 제한: RTMP 트랜스코딩은 스트림당 ~0.5~1코어로 무거운 폭주 가능 워커.
    # 8코어 공용 호스트에서 옆 프로젝트를 굶기지 않도록 4코어 상한을 건다(동시 라이브 ~4~8개).
    cpus: "4.0"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    container_name: ghc_mysql_prod
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghc
      MYSQL_USER: ${MYSQL_USER:-ghc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ghc_prod
    mem_limit: 2g
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ghc_prod:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_prod_data:
