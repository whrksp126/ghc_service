services:
  front:
    container_name: longdcam_front_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://longdcam-back.ghmate.com
        VITE_SOCKET_URL: https://longdcam-back.ghmate.com
        VITE_LIVEKIT_URL: wss://longdcam-back.ghmate.com/livekit
        VITE_ENV: production
    networks:
      - longdcam_prod
      - nginx_proxy
    restart: always

  api:
    container_name: longdcam_api_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  livekit:
    container_name: longdcam_livekit_prod
    image: livekit/livekit-server:latest
    # Host network: binds 7880/tcp (signaling) + 40100/udp (WebRTC media) directly.
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    # use_external_ip (livekit.yaml) STUN-detects + advertises the public IP, so external
    # (cellular) clients reach media via the forwarded 40100/udp. No --node-ip (it's
    # ignored when use_external_ip is true).
    command: ["--config", "/etc/livekit.yaml"]
    restart: always

  turn:
    container_name: longdcam_turn_prod
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf"]
    restart: always

  # Redis coordinates livekit-server <-> ingress. Bound to loopback only (host network
  # would otherwise expose 6379 publicly).
  redis:
    container_name: longdcam_redis_prod
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--protected-mode", "yes"]
    restart: always

  # LiveKit Ingress: OBS → RTMP(1935) → publishes into the room as a participant. Config is
  # injected via INGRESS_CONFIG_BODY so the API secret never lives in a committed file
  # (interpolated from longdcam_service/.env, same as MYSQL_* below). 1935/tcp must be
  # forwarded on the router; point a DNS-only (grey-cloud) record at it (INGRESS_RTMP_HOST).
  ingress:
    container_name: longdcam_ingress_prod
    image: livekit/ingress:latest
    network_mode: host
    environment:
      INGRESS_CONFIG_BODY: |
        logging:
          level: info
        redis:
          address: 127.0.0.1:6379
        ws_url: ws://127.0.0.1:7880
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        rtmp_port: 1935
        http_relay_port: 9090
        health_port: 9091
    depends_on:
      - redis
      - livekit
    restart: always

  mysql:
    container_name: longdcam_mysql_prod
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: longdcam
      MYSQL_USER: ${MYSQL_USER:-longdcam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - longdcam_prod
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  longdcam_prod:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_prod_data:
