listening-port=3478
tls-listening-port=5349

realm=ghc.ghmate.com

use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET

min-port=40000
# 40100/udp is reserved exclusively for LiveKit's UDP mux. Sharing it with coturn's relay
# allocator makes ICE packets land in either process unpredictably (intermittent PC failures).
max-port=40099

fingerprint
lt-cred-mech

no-cli
no-tlsv1
no-tlsv1_1

log-file=stdout
verbose
