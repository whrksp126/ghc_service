# nginx_proxy의 메인 nginx.conf는 `include /etc/nginx/conf.d/*.conf;`를 http 블록 안에서
# 수행하므로, 이 파일 최상단(server 블록 밖)의 디렉티브는 http 컨텍스트로 평가된다.
# → limit_req_zone을 여기에 선언하면 메인 nginx.conf를 건드릴 필요가 없다.
# zone명(ghc_api)은 다른 서비스 conf와 충돌하지 않도록 고유하게 둔다.
limit_req_zone $binary_remote_addr zone=ghc_api:10m rate=20r/s;

# GHC frontend
server {
    listen 80;
    listen 443 ssl;
    server_name ghc.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Docker 내장 DNS + 변수 proxy_pass: 컨테이너명을 문자열로 직접 쓰면 nginx가
    # reload 시점 IP를 캐시해 ①재배포로 IP가 바뀌면 502, ②컨테이너가 죽으면
    # `nginx -t` 실패로 다른 모든 프로젝트의 reload까지 막는다(장애 전파).
    # resolver + set $up 변수로 넘기면 요청마다 재확인 → 둘 다 사라진다
    # (업스트림이 죽어도 이 도메인만 런타임 502, 남에겐 무해).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $ghc_front ghc_front_prod;
        proxy_pass http://$ghc_front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# GHC API + Socket.IO + LiveKit signaling (network_mode: host → Docker gateway)
server {
    listen 80;
    listen 443 ssl;
    server_name ghc-api.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # api/livekit는 network_mode: host → 고정 게이트웨이 IP(172.17.0.1)로 직결한다.
    # 컨테이너명이 아닌 IP 리터럴이라 DNS 캐시/`nginx -t` 실패 위험이 없어
    # reload 전파 문제와 무관하다(변수화 불필요).

    # Express body size 상한(10mb)보다 여유를 둬 413 예방
    client_max_body_size 12m;

    # LiveKit signaling — reuses this domain's cert (no extra subdomain). WebRTC media
    # itself flows directly to 7881/tcp + 7882/udp on the host, NOT through nginx.
    # WebSocket 실시간 연결이므로 rate limit 미적용.
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://172.17.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Buffered browser-live playback (MediaMTX HLS on the host). Playlists are never cached;
    # completed media segments may be cached briefly. CORS is needed by the bundled desktop UI
    # whose origin is file://, while normal web viewers use the same endpoint.
    location /hls/ {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://172.17.0.1:8888;
        proxy_http_version 1.1;
        proxy_buffering off;
        # MediaMTX's cookie-check redirect is root-relative because it does not know about the
        # external /hls prefix. Restore it or the player lands on the Express API location.
        proxy_redirect ~^/(.*)$ /hls/$1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # REST API 엔드포인트에 rate limit 적용 (IP당 20 req/s, burst 40).
        # Socket.IO 롱폴링/WebSocket upgrade 요청도 이 location을 통과하므로
        # burst=40 nodelay 로 실시간 연결 초기 핸드셰이크 버스트를 허용한다.
        limit_req zone=ghc_api burst=40 nodelay;

        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
