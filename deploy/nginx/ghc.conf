# nginx_proxy의 메인 nginx.conf는 `include /etc/nginx/conf.d/*.conf;`를 http 블록 안에서
# 수행하므로, 이 파일 최상단(server 블록 밖)의 디렉티브는 http 컨텍스트로 평가된다.
# → limit_req_zone을 여기에 선언하면 메인 nginx.conf를 건드릴 필요가 없다.
# zone명(ghc_api)은 다른 서비스 conf와 충돌하지 않도록 고유하게 둔다.
limit_req_zone $binary_remote_addr zone=ghc_api:10m rate=20r/s;

# GHC frontend
server {
    listen 80;
    listen 443 ssl;
    server_name ghc.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    location / {
        proxy_pass http://ghc_front_prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# GHC API + Socket.IO + LiveKit signaling (network_mode: host → Docker gateway)
server {
    listen 80;
    listen 443 ssl;
    server_name ghc-api.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Express body size 상한(10mb)보다 여유를 둬 413 예방
    client_max_body_size 12m;

    # LiveKit signaling — reuses this domain's cert (no extra subdomain). WebRTC media
    # itself flows directly to 7881/tcp + 7882/udp on the host, NOT through nginx.
    # WebSocket 실시간 연결이므로 rate limit 미적용.
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://172.17.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        # REST API 엔드포인트에 rate limit 적용 (IP당 20 req/s, burst 40).
        # Socket.IO 롱폴링/WebSocket upgrade 요청도 이 location을 통과하므로
        # burst=40 nodelay 로 실시간 연결 초기 핸드셰이크 버스트를 허용한다.
        limit_req zone=ghc_api burst=40 nodelay;

        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
