logLevel: info
api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998

# Browser live enters here first. MediaMTX remuxes the original H.264/AAC into HLS without
# transcoding (no quality/frame loss), while runOnReady forwards the same stream to LiveKit for
# compatibility/presence. LIVEKIT_RTMP_TARGET differs between host-network prod and bridge local.
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
hls: true
hlsAlwaysRemux: true
hlsVariant: mpegts
# Keep ~40 seconds server-side (actual segment boundary follows the broadcaster's 2s GOP).
# The player stays ~12s behind; the extra history lets it refill after a longer network wobble.
hlsSegmentCount: 20
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 60s

pathDefaults:
  source: publisher

paths:
  # Original browser-live input. G1 is the unguessable LiveKit stream key.
  "~^x/(.+)$":
    runOnReady: sh /relay-live.sh
    runOnReadyRestart: true
  # Aligned HLS outputs from one FFmpeg reader. No hooks here (avoid recursive relays).
  "~^abr1080/(.+)$":
  "~^abr720/(.+)$":
