# LiveKit SFU — production config.
# Runs with network_mode: host. API keys are injected via the LIVEKIT_KEYS env
# var (from backend/.env) and are NEVER committed in this file.
#
# Ports (must be forwarded on the home router):
#   7880/tcp   signaling (WS) — proxied by nginx as ghc-api.ghmate.com/livekit
#   40100/udp  WebRTC media — top of the already-forwarded 40000-40100 range, so no new
#              router rule is needed. coturn shares the range but allocates from 40000 up,
#              so it effectively never reaches 40100.
port: 7880

# Shared with the ingress service so OBS RTMP streams can be routed into rooms. Loopback
# redis (see docker-compose redis service, bound to 127.0.0.1).
redis:
  address: 127.0.0.1:6379

rtc:
  tcp_port: 7881
  # Reuse the existing 40000-40100/udp port-forward (mediasoup's old range) as a single
  # UDP mux port at the top of the range.
  udp_port: 40100
  # STUN-detect the public IP and advertise it so external (cellular) clients reach media
  # via the port-forward. Same topology the old mediasoup used; LAN clients reach it via
  # the router's NAT hairpin. (LiveKit can't advertise LAN + public at once — issue #1898.)
  use_external_ip: true

  # ── 라이브 재생 버퍼가 실제로 동작하려면 (재전송 이력) ──────────────────────
  # 클라이언트는 라이브(OBS/브라우저 라이브)를 5초 버퍼링해서 재생한다
  # (frontend/src/lib/livekitRoom.ts의 LIVE_PLAYOUT_DELAY_SEC). 그 5초 안에 유실 패킷을
  # 다시 받아 끼워넣으면 화질 저하 없이 그냥 이어서 재생된다 — 일반 라이브 서비스의
  # "버퍼 채우고 계속" 동작.
  # 그런데 재전송은 SFU가 그 패킷을 아직 들고 있을 때만 가능하다. 기본 500패킷은
  # 1080p/3.5Mbps에서 겨우 ~1.5초치라, 클라이언트 버퍼가 아무리 깊어도 그 이상 된
  # 유실은 복구를 못 한다. 버퍼 창을 덮도록 늘린다.
  # 비용은 메모리뿐: 비디오 트랙당 대략 2000×1.3KB ≈ 2.6MB (mem_limit 4g).
  packet_buffer_size_video: 2000
  packet_buffer_size_audio: 800

  # ── 화질 우선 (품질 진동 억제) ───────────────────────────────────────────────
  # 기본값의 SFU는 시청자별 대역폭 추정치가 흔들릴 때마다 simulcast 레이어를
  # 올렸다 내렸다 한다. 그래서 "선명 → 흐림 → 다시 선명"이 몇 초 주기로 반복된다.
  # 라이브는 1080p + 540p 두 레이어를 제공한다. 실제 수신 대역폭을 사용해야 약한 웹
  # 시청자만 540p로 내려가고, 좋은 회선의 시청자는 1080p를 그대로 유지할 수 있다.
  congestion_control:
    enabled: true
    # 대역폭이 모자라도 트랙을 아예 멈추지 않는다(멈췄다 켜지는 게 제일 눈에 띈다).
    allow_pause: false
    stream_allocator:
      # 0 = LiveKit의 실제 수신 대역폭 추정 사용. 강제 5Mbps는 좁은 회선에서도 1080p를
      # 밀어 넣어 패킷 손실/재전송/끊김을 만들었다.
      min_channel_capacity: 0

# Embedded TURN disabled for now: rely on host-candidate UDP (7882) + TCP fallback
# (7881). The legacy coturn still serves the P2P device-preview path. Revisit if
# clients on restrictive/symmetric-NAT networks fail to connect.
turn:
  enabled: false

logging:
  level: info
  json: false
