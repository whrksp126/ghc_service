# LiveKit SFU — LOCAL DEV config only.
# Keys are inline here on purpose: this is a throwaway local secret, never used in
# prod. Same key/secret must be set in backend/.env.local (LIVEKIT_API_KEY/SECRET).
port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Localhost testing: announce loopback/LAN directly, no STUN.
  use_external_ip: false

  # Mirror prod's 화질 우선 + 라이브 재생 버퍼 tuning so local testing reproduces prod
  # behaviour. (See livekit.yaml for the rationale and the trade-offs.)
  packet_buffer_size_video: 2000
  packet_buffer_size_audio: 800

  congestion_control:
    enabled: true
    allow_pause: false
    stream_allocator:
      min_channel_capacity: 0

keys:
  devkey: localdevsecret0123456789abcdefghij

# Coordinates with the ingress service (OBS-free native live → RTMP → room).
# Same bridge network, reachable by service name.
redis:
  address: redis:6379

turn:
  enabled: false

logging:
  level: info
  json: false
